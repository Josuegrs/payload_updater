name: Update payload catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: payload-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Actualizar catálogo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python update_payloads.py

      - name: Guardar cambios
        run: |
          if ! git diff --quiet -- payloads-extra.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add payloads-extra.json
            git commit -m 'Actualizar versiones de payloads'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
